[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euterpe"
version = "0.1.0"
description = "EUTERPE — Discovery Intelligence for Music: Personalized recommendation and long-tail discovery engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "EUTERPE Research Team"}
]
keywords = ["music-recommendation", "discovery-intelligence", "collaborative-filtering", "two-tower", "vector-search", "reranking"]

dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "polars>=0.20.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "implicit>=0.7.0",
    "torch>=2.2.0",
    "faiss-cpu>=1.7.4",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "plotly>=5.20.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "mlflow>=2.11.0",
    "black>=24.0.0",
    "ruff>=0.3.0"
]

[tool.setuptools.packages.find]
where = ["src"]
